# Etapa inicial: desafío HTTP-01; no presupone un certificado instalado.
server {
    listen 80;
    listen [::]:80;
    server_name panozosistemas.com.ar www.panozosistemas.com.ar;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt-panozosistemas;
        default_type text/plain;
        try_files $uri =404;
    }

    # Ventana de migración: habilitar HTTPS después de emitir el certificado.
    location / {
        default_type text/plain;
        add_header Retry-After 120 always;
        return 503 "Panozo Sistemas: migracion en curso. Reintente en unos minutos.\n";
    }
}
