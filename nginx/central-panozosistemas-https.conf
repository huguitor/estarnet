server {
    listen 80;
    listen [::]:80;
    server_name panozosistemas.com.ar www.panozosistemas.com.ar;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt-panozosistemas;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # El stream central deriva aquí el tráfico web de 443 según SNI.
    listen 127.0.0.1:8443 ssl;
    server_name panozosistemas.com.ar www.panozosistemas.com.ar;

    ssl_certificate /etc/letsencrypt/live/panozosistemas.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panozosistemas.com.ar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # El stream actual no transporta la IP cliente con PROXY protocol.
        # Sobrescribir cadenas externas evita confiar en XFF del visitante.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
